<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-w38doBTXzLLSHBQu07y5gTAkHL9cffocObClF9nTU6w='; style-src 'unsafe-inline'; img-src data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light">
<title>PrintZing Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#fff;color:#0A2658;padding:0 0 90px}
header{background:#0A2658;color:#fff;padding:16px 18px;font-weight:800;font-size:1.2rem;border-bottom:5px solid #D60C7E}
main{max-width:720px;margin:0 auto;padding:16px}
.box{border:2px solid #E3E8F1;border-radius:18px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:1.05rem}
label{display:block;font-weight:700;font-size:.85rem;margin:8px 0 3px}
input[type=text],input[type=password],input[type=number]{width:100%;padding:11px 12px;border:2px solid #E3E8F1;border-radius:12px;font:inherit;color:#0A2658}
button{font:inherit;font-weight:700;border-radius:999px;border:2px solid #0A2658;background:#fff;color:#0A2658;padding:9px 16px;cursor:pointer}
button.p{background:#D60C7E;border-color:#D60C7E;color:#fff}button.n{background:#0A2658;color:#fff}
.row{display:grid;grid-template-columns:84px 1fr;gap:10px;padding:12px 0;border-top:1px solid #E3E8F1}
.row:first-child{border-top:0}
.th{width:84px;height:84px;object-fit:contain;border:2px solid #E3E8F1;border-radius:12px;background:#fff}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ck{display:flex;gap:14px;align-items:center;margin:8px 0;font-size:.9rem;flex-wrap:wrap}.ck label{display:flex;gap:6px;align-items:center;margin:0}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ac button{padding:6px 12px;font-size:.85rem}.dl{color:#D60C7E;border-color:#D60C7E}
#bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid #E3E8F1;padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
#msg{font-size:.9rem;font-weight:600;min-height:1.2em;text-align:center;width:100%}.er{color:#D60C7E}.ok{color:#0a7a3d}
small{color:#52618A}
</style></head><body>
<header>PrintZing Admin Panel</header>
<main>
<div class="box"><h2>GitHub se connect</h2>
<small>Ye details sirf is phone/computer ke browser mein rehti hain.</small>
<label for="o">GitHub username</label><input type="text" id="o" autocomplete="off">
<label for="r">Repository ka naam</label><input type="text" id="r" autocomplete="off">
<label for="b">Branch (aam taur par main)</label><input type="text" id="b" value="main" autocomplete="off">
<label for="t">Access token</label><input type="password" id="t" autocomplete="off">
<div class="ac"><button class="n" id="ld" type="button">Connect &amp; products laayein</button><button class="dl" id="fg" type="button">Token hatayein</button></div></div>
<div class="box"><h2>Products</h2><div id="list"><small>Pehle upar connect karein.</small></div>
<div class="ac"><button class="p" id="ad" type="button">+ Naya product</button></div></div>
</main>
<div id="bar"><div id="msg" role="status"></div><button class="p" id="sv" type="button">Website par save karein</button></div>
<script>
(function(){
var $=function(i){return document.getElementById(i)},L=[],sha='',loaded=false,ls;
try{ls=window.localStorage}catch(e){ls=null}
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function msg(t,bad){var m=$('msg');m.textContent=t;m.className=bad?'er':'ok'}
function cfg(){return{o:$('o').value.trim(),r:$('r').value.trim(),b:$('b').value.trim()||'main',t:$('t').value.trim()}}
['o','r','b','t'].forEach(function(k){try{var v=ls&&ls.getItem('pz_'+k);if(v)$(k).value=v}catch(e){}});
function keep(c){try{if(ls)['o','r','b','t'].forEach(function(k){ls.setItem('pz_'+k,c[k])})}catch(e){}}
function api(c,extra,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+c.t,'Accept':'application/vnd.github+json'},opt.headers||{});
  return fetch('https://api.github.com/repos/'+encodeURIComponent(c.o)+'/'+encodeURIComponent(c.r)+'/contents/products.json'+extra,opt)}
function b64(s){var u=new TextEncoder().encode(s),o='';for(var i=0;i<u.length;i+=32768)o+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(o)}
function rs(f){return new Promise(function(ok,no){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){
  var k=Math.min(1,520/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
  var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.74))};
  im.onerror=no;im.src=fr.result};fr.onerror=no;fr.readAsDataURL(f)})}
function why(r){return r.status===401?'Token galat ya expire ho gaya hai.':r.status===403?'Token ko is repository mein Contents: Read and write ki permission chahiye.':r.status===404?'Username/repository ka naam galat hai ya token ko is repo ka access nahi.':r.status===409?'File beech mein kisi aur ne badal di. "Connect & products laayein" dabakar dobara try karein.':r.status===422?'GitHub ne save reject kiya. Branch ka naam (main/master) aur repository check karein, phir Connect dabakar dobara try karein.':'Error '+r.status}
function draw(){
  var box=$('list');box.textContent='';
  if(!L.length){box.appendChild(mk('small','','Koi product nahi. "+ Naya product" dabayein.'));return}
  L.forEach(function(p,i){
    var r=mk('div','row'),th=mk('img','th');th.alt='';if(p.img)th.src=p.img;r.appendChild(th);
    var d=mk('div'),nm=mk('input'),pr=mk('input'),g=mk('div','g2');
    nm.type='text';nm.maxLength=80;nm.value=p.name;nm.placeholder='Product ka naam';nm.oninput=function(){p.name=nm.value};
    pr.type='number';pr.min=0;pr.value=p.price;pr.placeholder='Price';pr.oninput=function(){p.price=Math.max(0,Math.round(+pr.value||0))};
    var a=mk('div'),b=mk('div');a.appendChild(mk('label','','Naam'));a.appendChild(nm);b.appendChild(mk('label','','Price (\u20B9)'));b.appendChild(pr);g.appendChild(a);g.appendChild(b);d.appendChild(g);
    var ck=mk('div','ck'),l1=mk('label'),c1=mk('input'),l2=mk('label'),c2=mk('input');
    c1.type='checkbox';c1.checked=p.show!==false;c1.onchange=function(){p.show=c1.checked};l1.appendChild(c1);l1.appendChild(document.createTextNode('Website par dikhao'));
    c2.type='checkbox';c2.checked=p.note==='Combo';c2.onchange=function(){p.note=c2.checked?'Combo':''};l2.appendChild(c2);l2.appendChild(document.createTextNode('Combo'));
    ck.appendChild(l1);ck.appendChild(l2);d.appendChild(ck);
    var fi=mk('input');fi.type='file';fi.accept='image/*';fi.style.display='none';
    fi.onchange=function(){if(!fi.files[0])return;rs(fi.files[0]).then(function(u){p.img=u;th.src=u;msg('Photo lag gayi. Ab "Website par save karein" dabayein.')},function(){msg('Ye photo nahi khul saki.',1)})};
    var ac=mk('div','ac'),bp=mk('button','',p.img?'Photo badlein':'Photo chunein'),up=mk('button','','\u2191'),dn=mk('button','','\u2193'),dl=mk('button','dl','Delete');
    [bp,up,dn,dl].forEach(function(x){x.type='button'});
    bp.onclick=function(){fi.click()};
    up.onclick=function(){if(i>0){L.splice(i-1,0,L.splice(i,1)[0]);draw()}};
    dn.onclick=function(){if(i<L.length-1){L.splice(i+1,0,L.splice(i,1)[0]);draw()}};
    dl.onclick=function(){if(confirm('"'+(p.name||'Ye product')+'" delete karein?')){L.splice(i,1);draw()}};
    [bp,up,dn,dl,fi].forEach(function(x){ac.appendChild(x)});d.appendChild(ac);r.appendChild(d);box.appendChild(r)})}
$('ld').onclick=function(){
  var c=cfg();if(!c.o||!c.r||!c.t){msg('Username, repository aur token teeno bharein.',1);return}
  msg('Load ho raha hai...');var q='?ref='+encodeURIComponent(c.b);
  api(c,q).then(function(m){
    if(m.status===404){return m.json().then(function(){keep(c);sha='';L=[];loaded=true;draw();msg('products.json abhi repo mein nahi hai. Product add karke save karein.')})}
    if(!m.ok){msg(why(m),1);return}
    return m.json().then(function(j){sha=j.sha;return api(c,q,{headers:{'Accept':'application/vnd.github.raw+json'}})}).then(function(r){
      if(!r.ok){msg(why(r),1);return}return r.text()}).then(function(t){
      if(t==null)return;var d=JSON.parse(t);L=(d.products||[]);loaded=true;keep(c);draw();msg('Ho gaya: '+L.length+' products load hue.')})
  }).catch(function(){msg('Connect nahi ho paya. Internet ya details check karein.',1)})};
$('fg').onclick=function(){try{if(ls)['o','r','b','t'].forEach(function(k){ls.removeItem('pz_'+k)})}catch(e){}$('t').value='';msg('Token is browser se hata diya.')};
$('ad').onclick=function(){L.push({id:'p'+Date.now(),name:'',price:0,note:'',img:'',show:true});draw();window.scrollTo(0,document.body.scrollHeight)};
$('sv').onclick=function(){
  var c=cfg();if(!c.o||!c.r||!c.t){msg('Pehle connect karein.',1);return}
  for(var i=0;i<L.length;i++){if(!L[i].name.trim()){msg('Product '+(i+1)+' ka naam likhein.',1);return}if(!L[i].img){msg('"'+L[i].name+'" ki photo chunein.',1);return}}
  if(!loaded){msg('Pehle "Connect & products laayein" dabayein, phir save karein.',1);return}
  msg('Save ho raha hai...');
  api(c,'?ref='+encodeURIComponent(c.b)).then(function(m){
    if(m.status===404)return '';
    if(!m.ok)throw m;
    return m.json().then(function(j){return j.sha})
  }).then(function(s){
    var body={message:'Update products',content:b64(JSON.stringify({products:L},null,1)),branch:c.b};if(s)body.sha=s;
    return api(c,'',{method:'PUT',body:JSON.stringify(body),headers:{'Content-Type':'application/json'}})
  }).then(function(r){
    if(!r.ok){msg(why(r),1);return}
    return r.json().then(function(j){sha=j.content.sha;keep(c);msg('Save ho gaya! 1-2 minute mein website par dikhega.')})
  }).catch(function(e){if(e&&e.status){msg(why(e),1)}else{msg('Save nahi ho paya. Internet check karein.',1)}})};
})();
</script></body></html>
